appId: dev.codelock.desktop
productName: CodeLock
copyright: Copyright © 2026 CodeLock

# Pinned because electron lives in the workspace root node_modules, where
# electron-builder does not look; without it the build cannot resolve a version.
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

icon: build/icon.png

files:
  - dist/**/*
  # The bundled dashboard and settings screens, served over app://.
  - dist-renderer/**/*
  # The tray icon is read at runtime, so it has to travel inside the asar.
  - build/icon.png
  - package.json

# The renderer loads the hosted web app, so nothing else needs bundling — but
# electron-builder always copies the tree implied by "dependencies", which is
# how electron-updater reaches the packaged main process. Keep it in
# dependencies, not devDependencies, or auto-update fails at require() time.
asar: true

# In an npm workspace this MUST stay false. electron-builder otherwise runs a
# production install in appDir, which npm resolves against the hoisted root
# node_modules and prunes every devDependency — including electron-builder and
# its own app-builder binary, mid-build. The only runtime dep is
# electron-updater, which is pure JS and has nothing to rebuild.
npmRebuild: false

# --- Windows ---------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # Unsigned builds trigger SmartScreen. Supply CSC_LINK / CSC_KEY_PASSWORD in
  # CI to sign; without them the installer still works but warns on first run.
  signAndEditExecutable: true
  # publisherName is NOT set here. It must be exactly the CN of the signing
  # certificate — electron-updater checks the publisher on the downloaded
  # installer against it, and a mismatch makes every update fail *silently*:
  # no error, no dialog, no update, ever. It is passed at release time by
  # .github/workflows/release-desktop.yml, so an unsigned local build does not
  # need it. See README.md, "Desktop packaging and trusted install".

# --- Microsoft Store ------------------------------------------------------
# Not in `win.target` above: a plain `npm run dist` stays NSIS-only. The Store
# package is built by scripts/dist-store.mjs, which selects the appx target on
# the command line and supplies the three identity values Partner Center
# issued (identityName, publisher, publisherDisplayName). Those are deliberately
# not written here: they are per-account, they cannot be guessed, and an
# `${env.X}` macro left undefined makes every build fail, not just the Store
# one. What is static lives below.
appx:
  # Application/@Id. Not derived from identityName: that has a period in it,
  # and the derived form would change if the reserved name ever did.
  applicationId: CodeLock
  # Registers the windows.startupTask extension. Inside a package, the HKCU
  # Run key that app.setLoginItemSettings writes is virtualised and never read
  # at logon, so this is the only way "launch at login" works for a Store
  # install. The user enables it in Settings > Apps > Startup; the app itself
  # cannot force it, which is what Store policy 10.2.8 wants.
  addAutoLaunchExtension: true
  # Store packages update through the Store. electron-updater is switched off
  # at runtime too (src/updater.ts); this stops the build writing app-update.yml.
  electronUpdaterAware: false
  backgroundColor: '#111111'
  showNameOnTiles: true
  languages: [en-US]
  # electron-builder's default MinVersion is a pre-release Windows 10 build.
  # 1903 (18362) is where packaged apps gained the AppData behaviour the
  # NSIS-to-Store migration relies on; see docs/store/RESEARCH.md section 6.
  minVersion: 10.0.18362.0
  maxVersionTested: 10.0.26100.0
  # Store submissions must not be signed by us; the Store re-signs after
  # certification. electron-builder leaves the package unsigned when no
  # certificate is configured, which is the intended state.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CodeLock

# --- macOS -----------------------------------------------------------------
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  # Hardened runtime is required for notarization; entitlements below keep the
  # app able to draw over other windows.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Without this the kiosk window sits below the menu bar on macOS.
    LSUIElement: false
    NSAppleEventsUsageDescription: CodeLock needs this to keep the lock screen in front.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# --- Linux -----------------------------------------------------------------
linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: CodeLock
      Comment: Solve a problem to unlock your device
      Categories: Utility;Education;

# No `publish:` block on purpose.
#
# It used to hardcode `owner: your-github-username`, which produces an installed
# app whose updater polls a stranger's releases. Reading it from `${env.GH_OWNER}`
# instead was worse: electron-builder treats an undefined macro as a hard error,
# so `npm run dist` could not build at all without the variable set.
#
# Without this block electron-builder writes no app-update.yml, and the updater
# is simply inert — the right default for a local build. The release workflow
# supplies the real target on the command line, where it is derived from the
# repository being built rather than guessed.
