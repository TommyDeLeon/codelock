appId: dev.codelock.desktop
productName: CodeLock
copyright: Copyright © 2026 CodeLock

# Pinned because electron lives in the workspace root node_modules, where
# electron-builder does not look; without it the build cannot resolve a version.
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

icon: build/icon.png

files:
  - dist/**/*
  - package.json

# The renderer loads the hosted web app, so nothing else needs bundling — but
# electron-builder always copies the tree implied by "dependencies", which is
# how electron-updater reaches the packaged main process. Keep it in
# dependencies, not devDependencies, or auto-update fails at require() time.
asar: true

# In an npm workspace this MUST stay false. electron-builder otherwise runs a
# production install in appDir, which npm resolves against the hoisted root
# node_modules and prunes every devDependency — including electron-builder and
# its own app-builder binary, mid-build. The only runtime dep is
# electron-updater, which is pure JS and has nothing to rebuild.
npmRebuild: false

# --- Windows ---------------------------------------------------------------
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  # Unsigned builds trigger SmartScreen. Supply CSC_LINK / CSC_KEY_PASSWORD in
  # CI to sign; without them the installer still works but warns on first run.
  signAndEditExecutable: true
  # MUST be exactly the CN of the signing certificate. electron-updater checks
  # the publisher name on the downloaded installer against this string, and a
  # mismatch makes every update fail *silently* — no error, no dialog, no
  # update, forever. Set CODELOCK_PUBLISHER_CN to the CN you signed with; see
  # docs/TRUSTED-INSTALL.md. Left unset for unsigned local builds.
  publisherName: ${env.CODELOCK_PUBLISHER_CN}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CodeLock

# --- macOS -----------------------------------------------------------------
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [x64, arm64]
  # Hardened runtime is required for notarization; entitlements below keep the
  # app able to draw over other windows.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # Without this the kiosk window sits below the menu bar on macOS.
    LSUIElement: false
    NSAppleEventsUsageDescription: CodeLock needs this to keep the lock screen in front.

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# --- Linux -----------------------------------------------------------------
linux:
  category: Utility
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  desktop:
    entry:
      Name: CodeLock
      Comment: Solve a problem to unlock your device
      Categories: Utility;Education;

# Auto-update from GitHub Releases.
#
# Taken from the environment rather than hardcoded: there is no git remote on
# the development machine, and a wrong owner here produces an updater that
# silently checks someone else's releases. Set both before publishing:
#
#   GH_OWNER=<your github username or org>
#   GH_REPO=codelock
publish:
  provider: github
  owner: ${env.GH_OWNER}
  repo: ${env.GH_REPO}
