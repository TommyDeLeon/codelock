name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, migrate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codelock
          POSTGRES_PASSWORD: codelock
          POSTGRES_DB: codelock_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U codelock"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://codelock:codelock@localhost:5432/codelock_test?schema=public
      # CI-only throwaway values; env.ts refuses placeholders in production.
      JWT_ACCESS_SECRET: ci-access-secret-that-is-long-enough-000000
      JWT_REFRESH_SECRET: ci-refresh-secret-that-is-long-enough-00000
      JWT_UNLOCK_SECRET: ci-unlock-secret-that-is-long-enough-000000
      JUDGE0_URL: http://localhost:2358
      ENCRYPTION_KEY: ci-encryption-key-that-is-long-enough-0000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma

      # Proves the migrations in the repo actually build the schema the code
      # expects — a drifted migration is otherwise found in production.
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma

      - run: npm run typecheck --workspace @codelock/api

      # 420 tests covering grading, the speed gate, selection and session
      # transitions. They existed and ran nowhere: CI typechecked the API and
      # never executed a single one of them.
      - run: npm run test --workspace @codelock/api
      - run: npm run corpus:stats --workspace @codelock/api -- --check

  web:
    name: Web — typecheck and build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The web app imports @codelock/shared as source, so a contract change
      # that breaks a client fails here rather than at runtime.
      - run: npm run typecheck --workspace @codelock/shared
      # One palette, enforced. This repository carried four at once — pine
      # green in the shared tokens, brick red on the site and the dashboard,
      # peach on the dark lock screen — and the file arguing hardest for one of
      # them was the file nobody else read. A comment cannot stop a second
      # stylesheet being written; this can.
      - run: node scripts/check-palette.mjs

      - run: npm run typecheck --workspace @codelock/ui
      - run: npm run typecheck --workspace @codelock/web
      - run: npm run build --workspace @codelock/web

      # The marketing site is a separate deployment and shares @codelock/ui
      # with the lock screen, so a change to a shared component has to build
      # both or the demo silently drifts from the thing it demonstrates.
      - run: npm run typecheck --workspace @codelock/marketing
      - run: npm run build --workspace @codelock/marketing

  clients:
    name: Judge, desktop, mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Both shells consume @codelock/shared as source, so a contract change
      # that breaks the desktop or mobile client fails here, not at runtime.
      - run: npm run typecheck --workspace @codelock/judge
      - run: npm run typecheck --workspace @codelock/desktop
      - run: npm run typecheck --workspace @codelock/mobile
      - run: npm run build --workspace @codelock/desktop
      - run: npm run build --workspace @codelock/judge

      # The lock state machine and the kill switch decide whether a machine
      # opens, so they are tested on every push, not only on tag.
      #
      # This comment sat here for a while with no command under it: the claim
      # outlived the tests it described. The ten-second escape in particular is
      # a promise made in the README and on the lock screen, and it is how a
      # user gets out when anything else has gone wrong — so it is enforced
      # here rather than trusted.
      - run: npm run test --workspace @codelock/desktop

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory on purpose. A transitive advisory can land on a morning nobody
    # shipped anything, and a red X that blocks merges for something outside
    # this repo's control is a gate people learn to route around. This one is
    # here to be read, not obeyed — the job reports and the run stays green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  runtime-config:
    name: Web image is runtime-configurable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The published web image carries no NEXT_PUBLIC_* values, so the API
      # origin has to arrive at run time or a prebuilt deploy points every
      # browser at its own localhost and silently reaches nothing. Both halves
      # are asserted — the served origin and the CSP that permits reaching it.
      - run: ./scripts/test-runtime-config.sh
