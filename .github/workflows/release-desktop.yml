name: Release desktop

# Installers for Windows, macOS, and Linux, built on their native runners
# (electron-builder cannot produce a signed .dmg from Linux).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing ships without the suite that guards it. A tagged release that
  # silently regressed the sandbox or the lock state machine is worse than no
  # release: it auto-updates onto every installed device.
  verify:
    name: Tests, typecheck, containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test --workspace @codelock/desktop
      - run: npm run test --workspace @codelock/web
      - run: npm run test:containment --workspace @codelock/judge

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @codelock/desktop

      # The publish target is passed here rather than committed to
      # electron-builder.yml: it is derived from the repository being built, so
      # it cannot drift into pointing at someone else's releases, and a local
      # build needs no environment at all.
      - name: Build installer
        shell: bash
        run: |
          args=(--publish never)
          args+=(-c.publish.provider=github)
          args+=("-c.publish.owner=${{ github.repository_owner }}")
          args+=("-c.publish.repo=${{ github.event.repository.name }}")
          if [ -n "${{ vars.CODELOCK_PUBLISHER_CN }}" ]; then
            args+=("-c.win.publisherName=${{ vars.CODELOCK_PUBLISHER_CN }}")
          fi
          npx electron-builder "${args[@]}"
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The public half of the API's unlock key is baked in at build time.
          # Only the public key ships — users cannot forge unlock tokens from it.
          CODELOCK_UNLOCK_PUBLIC_KEY: ${{ secrets.CODELOCK_UNLOCK_PUBLIC_KEY }}
          CODELOCK_WEB_URL: ${{ vars.CODELOCK_WEB_URL }}
          # Code signing. Builds succeed without these but warn on first launch:
          # SmartScreen on Windows, Gatekeeper on macOS.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Signing is required for a real release. Unsigned artifacts are allowed
      # only when REQUIRE_SIGNING is off, which is how a dry run via
      # workflow_dispatch stays possible without certificates configured.
      - name: Verify signature (Windows)
        if: matrix.os == 'windows-latest' && vars.REQUIRE_SIGNING == 'true'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem release -Filter *.exe -File | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            '{0,-44} {1}' -f $_.Name, $sig.Status
            if ($sig.Status -ne 'Valid') { $failed = $true }
            # An untimestamped signature dies with the certificate, taking every
            # installed copy with it. Treat it as a failed build, not a warning.
            elseif (-not $sig.TimeStamperCertificate) {
              Write-Host "  ^ signed but NOT timestamped"
              $failed = $true
            }
            elseif ($sig.SignerCertificate.Subject -notmatch [regex]::Escape("CN=${{ vars.CODELOCK_PUBLISHER_CN }}")) {
              Write-Host "  ^ CN does not match CODELOCK_PUBLISHER_CN; auto-update would fail silently"
              $failed = $true
            }
          }
          if ($failed) { throw 'Unsigned, untimestamped, or mismatched artifacts. Refusing to publish.' }

      - name: Verify signature (macOS)
        if: matrix.os == 'macos-latest' && vars.REQUIRE_SIGNING == 'true'
        run: |
          set -e
          for app in release/mac*/*.app; do
            [ -e "$app" ] || continue
            codesign --verify --deep --strict --verbose=2 "$app"
            # Gatekeeper, not just a valid signature: an unnotarized build is
            # blocked on every machine but the one that built it.
            spctl --assess --type execute --verbose "$app"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: codelock-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      # Published on the download page so a user can verify what they got.
      # One file, so nobody has to open three.
      - name: Checksums
        working-directory: artifacts
        run: |
          # Basenames only: the per-runner artifact directories are an artefact
          # of the build matrix and mean nothing to someone verifying a download.
          for f in $(find . -type f -regex '.*\.\(exe\|dmg\|AppImage\|deb\)$' | sort); do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
