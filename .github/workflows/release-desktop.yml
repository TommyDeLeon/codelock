name: Release desktop

# Installers for Windows, macOS, and Linux, built on their native runners
# (electron-builder cannot produce a signed .dmg from Linux).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing ships without the suite that guards it. A tagged release that
  # silently regressed the sandbox or the lock state machine is worse than no
  # release: it auto-updates onto every installed device.
  verify:
    name: Tests, typecheck, containment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test --workspace @codelock/desktop
      - run: npm run test --workspace @codelock/web
      - run: npm run test:containment --workspace @codelock/judge

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
          - os: ubuntu-latest
            name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build --workspace @codelock/desktop

      - name: Build installer
        run: npx electron-builder --publish never
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The public half of the API's unlock key is baked in at build time.
          # Only the public key ships — users cannot forge unlock tokens from it.
          CODELOCK_UNLOCK_PUBLIC_KEY: ${{ secrets.CODELOCK_UNLOCK_PUBLIC_KEY }}
          CODELOCK_WEB_URL: ${{ vars.CODELOCK_WEB_URL }}
          # Where electron-updater looks for new versions. Wrong values here
          # produce an updater that silently polls someone else's releases.
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
          # Must be exactly the CN of the signing certificate, or every update
          # fails silently. See docs/TRUSTED-INSTALL.md.
          CODELOCK_PUBLISHER_CN: ${{ vars.CODELOCK_PUBLISHER_CN }}
          # Code signing. Builds succeed without these but warn on first launch:
          # SmartScreen on Windows, Gatekeeper on macOS.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: codelock-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
            apps/desktop/release/*.blockmap
          if-no-files-found: warn

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      # Published on the download page so a user can verify what they got.
      # One file, so nobody has to open three.
      - name: Checksums
        working-directory: artifacts
        run: |
          # Basenames only: the per-runner artifact directories are an artefact
          # of the build matrix and mean nothing to someone verifying a download.
          for f in $(find . -type f -regex '.*\.\(exe\|dmg\|AppImage\|deb\)$' | sort); do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*
            artifacts/SHA256SUMS.txt
          draft: true
          generate_release_notes: true
