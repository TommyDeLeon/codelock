name: Publish images

# Build the server images in CI and push them to GitHub Container Registry.
#
# The point is not speed, it is that a free-tier VM cannot build them. A Next.js
# production build wants well over a gigabyte of RAM, and the smallest
# always-free instances have one — so `docker compose build` on the box either
# OOM-kills the builder or swaps for twenty minutes. Building here and pulling
# there turns a deploy into a download.
#
# GHCR is free for public repositories, which is the other half of why this works.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: judge
            dockerfile: apps/judge/Dockerfile

    steps:
      - uses: actions/checkout@v4

      # Emulation for the arm64 half of the build. The genuinely-free VMs worth
      # using (Oracle's Ampere A1) are ARM, and an amd64-only image will not
      # start there at all.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The web image is built separately because its NEXT_PUBLIC_* values are
  # compiled into the client bundle. They have to be supplied here rather than
  # by whoever deploys it: by the time the image exists, the bundle is fixed.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # PUBLIC_SITE_URL cannot be supplied by whoever deploys this image.
      #
      # The API origin moved to runtime configuration, but metadataBase did not
      # and cannot without making every marketing page dynamic. It is read when
      # the bundle is compiled, so an unset variable bakes
      # "http://localhost:3000/og.png" into the Open Graph tags of every page in
      # the published image — and that is invisible from inside the running
      # container. Nothing is broken until somebody shares a link and the
      # preview is blank.
      #
      # Fail here, where the fix is one repository variable, rather than
      # publishing an image that looks correct.
      - name: Require PUBLIC_SITE_URL
        if: vars.PUBLIC_SITE_URL == ''
        run: |
          echo "::error::PUBLIC_SITE_URL is not set for this repository."
          echo "Open Graph URLs are compiled into the image and cannot be corrected at deploy time."
          echo "Set it under Settings -> Secrets and variables -> Actions -> Variables,"
          echo "for example  PUBLIC_SITE_URL = https://app.your-domain.com"
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/web
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL }}
            NEXT_PUBLIC_REPO_URL=https://github.com/${{ github.repository }}
            NEXT_PUBLIC_CONTACT_EMAIL=${{ vars.PUBLIC_CONTACT_EMAIL }}
